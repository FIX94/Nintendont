[Xbox 360/XInput Controller - natural GameCube layout]
VID=045e
PID=028e

# Endpoint and inversion keys below are ignored: the kernel discovers the
# endpoints from the descriptors and normalizes the axes itself.
EndpointOut=1
invert_lx=0
invert_ly=1
invert_rx=0
invert_ry=1

MultiIn=0
Polltype=1
DPAD=0
DigitalLR=2

# Face buttons follow their printed labels.
A=3,10
B=3,20
X=3,40
Y=3,80

Up=2,01
Down=2,02
Left=2,04
Right=2,08

# Xbox LT/RT provide analog values; E0 is the GameCube digital-click threshold.
L=4,E0
R=5,E0
LAnalog=4
RAnalog=5

# Right bumper is the GameCube Z shoulder button.
Z=3,02
ZL=0,00
S=2,10

# Guide/Home, Back, and stick-click buttons are intentionally not mapped.
Power=0,00

# XInput 16-bit axes are normalized into these four bytes by kernel/HID.c.
StickX=6,1A,100
StickY=7,1A,100
CStickX=8,1A,100
CStickY=9,1A,100
